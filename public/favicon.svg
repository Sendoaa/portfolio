<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" /> <!-- Primary (blue) -->
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" /> <!-- Secondary (violet) -->
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" /> <!-- Accent (emerald) -->
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="#020617" /> <!-- slate-950 -->
  <!-- Inner Border Glow -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5" />
  
  <!-- Text {S} -->
  <text x="50" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#grad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-3">{S}</text>
</svg>